name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust core (build + test)
    strategy:
      fail-fast: false
      matrix:
        # Both target platforms per PRD §5 ("cross-platform desktop, single
        # codebase"). Windows was deferred during M0 for lack of a local
        # Windows machine — this matrix is that deferred validation,
        # exercised for real on GitHub's own Windows runners.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # RAW decoding (ADR-0003) links a vcpkg-installed prebuilt LibRaw on
      # Windows instead of compiling it from source under MSVC (see
      # app/src-tauri/vendor/rsraw-sys/PATCH.md). GitHub's windows-latest
      # runners ship vcpkg pre-installed with VCPKG_INSTALLATION_ROOT set --
      # this step assumes that rather than bootstrapping vcpkg fresh; if
      # this fails, that assumption is what to check first.
      #
      # The libraw port version is pinned to 0.21.3 -- the exact version
      # vendored at app/src-tauri/vendor/rsraw-sys/LibRaw (see its
      # libraw_version.h) -- because the Rust FFI struct layout for
      # libraw_data_t/libraw_output_params_t is bindgen-generated from that
      # vendored header. Leaving the runner's preinstalled vcpkg registry
      # unpinned let it silently drift to newer libraw releases (e.g.
      # 0.22.1): a real CI run resolved that version and every write
      # through the Rust struct (raw_decode.rs's `output_bps = 16`,
      # `gamm`/`no_auto_bright`, etc.) landed on the wrong in-memory offset,
      # because 0.21.3's and 0.22.1's struct layouts don't agree. That's
      # what made `linear_decode_produces_a_darker_unbrightened_buffer...`
      # fail: LibRaw kept processing at 8-bit despite the 16-bit request
      # (confirmed via a temporary diagnostic dump of ProcessedImage's
      # Debug output on a real Windows run -- see PROGRESS.md). A LIBRAW_LOCK
      # mutex was tried first on the (wrong) assumption this was a
      # cross-thread race; it didn't fix it, which is what led to adding
      # the diagnostic and finding the real cause here.
      - name: Install LibRaw via vcpkg (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin cdf98aaa2411f565eacb3c7566e5e20542ae151a
          git -C "$VCPKG_INSTALLATION_ROOT" checkout cdf98aaa2411f565eacb3c7566e5e20542ae151a -- ports/libraw
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libraw:x64-windows-static-md
          # The vcpkg *crate* (used by rsraw-sys's build.rs) looks for
          # VCPKG_ROOT specifically -- the runner only sets
          # VCPKG_INSTALLATION_ROOT, which is a different variable. Confirmed
          # via a real CI failure (VcpkgNotFound) before this line existed.
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: cargo build
        run: cargo build --verbose

      # Real-file RAW decode/import tests (raw_decode.rs, import.rs) are
      # gated behind EMULSION_TEST_RAW_SAMPLE and silently *skip* without
      # it — not committed to the repo as a fixture, per ADR-0003 (large,
      # third-party provenance). Without this step, "cargo test" would
      # only ever exercise the error paths, never a real decode, in CI.
      # Fetch the same CC0-licensed sample used to validate this locally
      # (raw.pixls.us requires CC0 for all contributions) so the real
      # decode path actually runs here too, not just on a dev machine.
      # Best-effort, not a hard job failure: this is a third-party host
      # outside our control, and a real outage there must never block CI
      # for an otherwise-passing code change. Confirmed the hard way --
      # raw.pixls.us was unreachable for over an hour across 3 separate
      # full CI runs (PR #103), every other check green the whole time
      # (see PROGRESS.md). The gated tests below already skip cleanly
      # with a clear message when EMULSION_TEST_RAW_SAMPLE is unset --
      # exactly the same "a real fixture may not be available" gap this
      # project already accepts and documents elsewhere (e.g. ADR-0003's
      # Windows-hardware-only checks) -- so on a download failure, this
      # step just leaves that env var unset rather than failing the job.
      - name: Download sample RAW file (CC0, raw.pixls.us) for real-file tests
        shell: bash
        run: |
          if curl --retry 3 --retry-delay 5 -fL \
            -o "${{ runner.temp }}/sample.DNG" \
            "https://raw.pixls.us/data/Adobe%20DNG%20Converter/Canon%20EOS%205D%20Mark%20III/5G4A9395-compressed-lossless.DNG"; then
            echo "EMULSION_TEST_RAW_SAMPLE=${{ runner.temp }}/sample.DNG" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not download the CC0 RAW sample from raw.pixls.us -- real-file-gated tests will skip this run. Treated as a transient external-host issue, not a code problem, unless it persists across many runs."
          fi

      - name: cargo test --lib
        shell: bash
        run: cargo test --lib --verbose

  frontend-check:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check

  e2e:
    name: E2E (WebdriverIO)
    strategy:
      fail-fast: false
      matrix:
        # Same two platforms as rust-core -- the embedded WebDriver
        # provider (tauri-plugin-wdio-webdriver) supports macOS/Windows/
        # Linux, but this project only targets the first two (PRD §5).
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Same LibRaw-via-vcpkg step rust-core uses (including the libraw
      # version pin -- see that job's own comment for why) -- the e2e build
      # compiles the full app (src-tauri), which needs it too.
      - name: Install LibRaw via vcpkg (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin cdf98aaa2411f565eacb3c7566e5e20542ae151a
          git -C "$VCPKG_INSTALLATION_ROOT" checkout cdf98aaa2411f565eacb3c7566e5e20542ae151a -- ports/libraw
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libraw:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Builds the debug binary with the wdio-webdriver feature + e2e
      # capability/config (see tauri.e2e.conf.json, Cargo.toml's
      # wdio-webdriver feature) and runs the WebdriverIO suite against it.
      - run: npm run test:e2e
