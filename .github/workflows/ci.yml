name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust core (build + test)
    strategy:
      fail-fast: false
      matrix:
        # Both target platforms per PRD §5 ("cross-platform desktop, single
        # codebase"). Windows was deferred during M0 for lack of a local
        # Windows machine — this matrix is that deferred validation,
        # exercised for real on GitHub's own Windows runners.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`: Rust 1.100 (2026-11-09) moved Cargo's build directory to `build/<crate>/<hash>/out`, and
      # `ort-sys` 2.0.0-rc.13 (pinned in Cargo.toml) takes `OUT_DIR`'s third ancestor for the target directory, so on
      # Windows its `copy-dylibs` step lands one level too deep (`target/debug/build`) and panics on a directory that
      # does not exist ("The system cannot find the path specified", build script of ort-sys). Fixed upstream in
      # ort-sys 2.0.0-rc.14. Drop this pin when `ort` moves to rc.14 or later.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # RAW decoding (ADR-0003) links a vcpkg-installed prebuilt LibRaw on
      # Windows instead of compiling it from source under MSVC (see
      # app/src-tauri/vendor/rsraw-sys/PATCH.md). GitHub's windows-latest
      # runners ship vcpkg pre-installed with VCPKG_INSTALLATION_ROOT set --
      # this step assumes that rather than bootstrapping vcpkg fresh; if
      # this fails, that assumption is what to check first.
      #
      # The libraw port version is pinned to 0.21.3 -- the exact version
      # vendored at app/src-tauri/vendor/rsraw-sys/LibRaw (see its
      # libraw_version.h) -- because the Rust FFI struct layout for
      # libraw_data_t/libraw_output_params_t is bindgen-generated from that
      # vendored header. Leaving the runner's preinstalled vcpkg registry
      # unpinned let it silently drift to newer libraw releases (e.g.
      # 0.22.1): a real CI run resolved that version and every write
      # through the Rust struct (raw_decode.rs's `output_bps = 16`,
      # `gamm`/`no_auto_bright`, etc.) landed on the wrong in-memory offset,
      # because 0.21.3's and 0.22.1's struct layouts don't agree. That's
      # what made `linear_decode_produces_a_darker_unbrightened_buffer...`
      # fail: LibRaw kept processing at 8-bit despite the 16-bit request
      # (confirmed via a temporary diagnostic dump of ProcessedImage's
      # Debug output on a real Windows run -- see PROGRESS.md). A LIBRAW_LOCK
      # mutex was tried first on the (wrong) assumption this was a
      # cross-thread race; it didn't fix it, which is what led to adding
      # the diagnostic and finding the real cause here.
      - name: Install LibRaw via vcpkg (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The whole ports/ tree, not only ports/libraw: libraw's dependencies must not follow the runner image.
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin cdf98aaa2411f565eacb3c7566e5e20542ae151a
          rm -rf "$VCPKG_INSTALLATION_ROOT/ports"
          git -C "$VCPKG_INSTALLATION_ROOT" checkout cdf98aaa2411f565eacb3c7566e5e20542ae151a -- ports
          # Classic mode installs jasper with its default `opengl` feature although libraw asks for default-features false;
          # naming jasper[core] in the same command keeps freeglut and the OpenGL ports out (scripts/vcpkg_expected_versions.json).
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "jasper[core]:x64-windows-static-md" libraw:x64-windows-static-md
          # The vcpkg *crate* (used by rsraw-sys's build.rs) looks for
          # VCPKG_ROOT specifically -- the runner only sets
          # VCPKG_INSTALLATION_ROOT, which is a different variable. Confirmed
          # via a real CI failure (VcpkgNotFound) before this line existed.
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # RFC-0038 A1: the whole ports/ tree comes from one vcpkg commit, so the libraries LibRaw pulls in (and their licences)
      # are the ones recorded in scripts/vcpkg_expected_versions.json; fails when an installed version differs or one is new.
      - name: vcpkg libraries are the recorded versions (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: '"$VCPKG_INSTALLATION_ROOT/vcpkg" list | python "$GITHUB_WORKSPACE/scripts/check_vcpkg_versions.py" -'

      # RFC-0038 A4: the vcpkg port must be the LibRaw this repository vendors (bindgen builds the FFI structs from the
      # vendored header), which also makes "the source of LibRaw is the vendored 0.21.3 plus the port's patches" a checked claim.
      - name: LibRaw from vcpkg is the vendored version (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/check_libraw_version.py" "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/include/libraw/libraw_version.h"

      # RFC-0038 A1: record in the log what the vcpkg LibRaw is made of (version, what it depends on, the port's patches and
      # source archive, the libraries it installs), which docs/rfc/RFC-0038-appendix/installer-inventory.md quotes. Information
      # only: it never fails the job.
      - name: Record what the vcpkg LibRaw is made of (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" list libraw || true
          "$VCPKG_INSTALLATION_ROOT/vcpkg" depend-info libraw:x64-windows-static-md || true
          echo "--- ports/libraw"; ls "$VCPKG_INSTALLATION_ROOT/ports/libraw" || true
          echo "--- portfile.cmake"; grep -nE 'URL|SHA512|REF |REPO|PATCHES|\.patch|LICENSE|COPYRIGHT' "$VCPKG_INSTALLATION_ROOT/ports/libraw/portfile.cmake" || true
          echo "--- vcpkg.json"; cat "$VCPKG_INSTALLATION_ROOT/ports/libraw/vcpkg.json" || true
          echo "--- installed lib"; ls "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib" || true
          echo "--- installed share/libraw"; ls "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share/libraw" || true
          # The libraries the port pulls in (their licences are what THIRD_PARTY_LIBRARIES.md must name for Windows builds).
          for p in jasper lcms libjpeg-turbo zlib; do
            echo "--- $p"
            grep -E '"(version|version-string|license|homepage)"' "$VCPKG_INSTALLATION_ROOT/ports/$p/vcpkg.json" || true
            head -n 6 "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share/$p/copyright" || true
          done

      # RFC-0038 A1/A2: the copyright files licenses/ ships for the Windows libraries must be the ones the pinned vcpkg tree installs.
      # Costs a few `cmp` calls; fails if a vcpkg bump changes a text without licenses/ following (see VCPKG_TEXTS in the generator).
      - name: vcpkg licence texts are the shipped ones (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for p in jasper lcms libjpeg-turbo zlib; do
            cmp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/share/$p/copyright" "$GITHUB_WORKSPACE/licenses/vcpkg-$p-copyright.txt"
          done

      - name: cargo build
        run: cargo build --verbose

      # Real-file RAW decode/import tests (raw_decode.rs, import.rs) are
      # gated behind EMULSION_TEST_RAW_SAMPLE and silently *skip* without
      # it — not committed to the repo as a fixture, per ADR-0003 (large,
      # third-party provenance). Without this step, "cargo test" would
      # only ever exercise the error paths, never a real decode, in CI.
      # Fetch the same CC0-licensed sample used to validate this locally
      # (raw.pixls.us requires CC0 for all contributions) so the real
      # decode path actually runs here too, not just on a dev machine.
      # Best-effort, not a hard job failure: this is a third-party host
      # outside our control, and a real outage there must never block CI
      # for an otherwise-passing code change. Confirmed the hard way --
      # raw.pixls.us was unreachable for over an hour across 3 separate
      # full CI runs (PR #103), every other check green the whole time
      # (see PROGRESS.md). The gated tests below already skip cleanly
      # with a clear message when EMULSION_TEST_RAW_SAMPLE is unset --
      # exactly the same "a real fixture may not be available" gap this
      # project already accepts and documents elsewhere (e.g. ADR-0003's
      # Windows-hardware-only checks) -- so on a download failure, this
      # step just leaves that env var unset rather than failing the job.
      - name: Download sample RAW file (CC0, raw.pixls.us) for real-file tests
        shell: bash
        run: |
          if curl --retry 3 --retry-delay 5 -fL \
            -o "${{ runner.temp }}/sample.DNG" \
            "https://raw.pixls.us/data/Adobe%20DNG%20Converter/Canon%20EOS%205D%20Mark%20III/5G4A9395-compressed-lossless.DNG"; then
            echo "EMULSION_TEST_RAW_SAMPLE=${{ runner.temp }}/sample.DNG" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not download the CC0 RAW sample from raw.pixls.us -- real-file-gated tests will skip this run. Treated as a transient external-host issue, not a code problem, unless it persists across many runs."
          fi

      # HDR merge's own real-bracket test (hdr_merge.rs, RFC-0003 §4) is
      # gated behind EMULSION_TEST_HDR_BRACKET_DIR the same way the RAW
      # decode tests above are gated behind EMULSION_TEST_RAW_SAMPLE --
      # except this fixture IS committed to the repo
      # (test_image/hdr-bracket-cc-by/, see its own ATTRIBUTION.md), since
      # a small (~27MB), individually-license-verified subset of a real
      # CC BY 4.0 dataset was judged worth the one-time exception to this
      # repo's otherwise CC0-only test_image/ convention -- no download
      # step needed here, unlike the raw.pixls.us sample above.
      - name: Point EMULSION_TEST_HDR_BRACKET_DIR at the committed bracket fixture
        shell: bash
        run: echo "EMULSION_TEST_HDR_BRACKET_DIR=${{ github.workspace }}/test_image/hdr-bracket-cc-by" >> "$GITHUB_ENV"

      - name: cargo test --lib --bins --tests
        shell: bash
        # --bins/--tests: the emulsion-ai helper's own unit tests and tests/ai_helper.rs (spawns the real helper binary).
        run: cargo test --lib --bins --tests --verbose

  frontend-check:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check

      # Model editions (RFC-0038 slice 4, ADR-0012). Neither step uses the network. The first runs the pure edition tests
      # (Vitest is not otherwise part of this workflow); the second checks what the fetch script would bundle: the
      # no-LaMa fixture leaves out exactly the removal model, and the default edition bundles all seven files.
      - run: npx vitest run scripts
      - name: Edition manifest resolves
        run: |
          node scripts/fetch-bundled-models.mjs --edition test-no-lama --list | tee "$RUNNER_TEMP/no-lama.txt"
          grep -qx 'omit     lama_fp32.onnx' "$RUNNER_TEMP/no-lama.txt"
          test "$(grep -c '^include ' "$RUNNER_TEMP/no-lama.txt")" = 6
          test "$(node scripts/fetch-bundled-models.mjs --list | grep -c '^include ')" = 7

  scripts-selftest:
    name: Scripts self-test and generated licence files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The provenance report builds its own throwaway git repository, so it needs no history from this checkout. It needs
      # Python 3.11 or later (tomllib). The committed report is a snapshot pinned to one commit, so CI does not regenerate it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scripts/provenance_report.py --self-test
      - run: python3 scripts/check_libraw_version.py --self-test
      - run: python3 scripts/check_vcpkg_versions.py --self-test
      - run: python3 scripts/gen_third_party_libraries.py --self-test

      # RFC-0038 A4: THIRD_PARTY_LIBRARIES.md and licenses/ are generated from the lockfile, the vendored LibRaw and the
      # crates' own files. `--check` writes nothing and fails if either differs from what the build would give, or if a
      # copyleft-only dependency appears that the conditions table does not name. It needs the same Rust as the build
      # (cargo tree and cargo metadata) and fetches the crate sources, which takes about a minute.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - run: python3 scripts/gen_third_party_libraries.py --check

      # When the check fails, regenerate in place and show how it differs, so the log says why (a platform difference in
      # `cargo tree` and a forgotten regeneration look the same in `--check`'s output).
      - name: Show how the generated files differ
        if: failure()
        run: |
          python3 scripts/gen_third_party_libraries.py || true
          git --no-pager diff --stat
          git --no-pager diff -U0 -- THIRD_PARTY_LIBRARIES.md | grep -E '^[-+]###' | head -80
          git --no-pager diff -U0 -- THIRD_PARTY_LIBRARIES.md | grep -E '^[-+]' | grep -vE '^[-+]###|^[-+]{3}' | tr ',' '\n' | sed 's/^[-+] *//' | head -0

  e2e:
    name: E2E (WebdriverIO)
    strategy:
      fail-fast: false
      matrix:
        # Same two platforms as rust-core -- the embedded WebDriver
        # provider (tauri-plugin-wdio-webdriver) supports macOS/Windows/
        # Linux, but this project only targets the first two (PRD §5).
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`: Rust 1.100 (2026-11-09) moved Cargo's build directory to `build/<crate>/<hash>/out`, and
      # `ort-sys` 2.0.0-rc.13 (pinned in Cargo.toml) takes `OUT_DIR`'s third ancestor for the target directory, so on
      # Windows its `copy-dylibs` step lands one level too deep (`target/debug/build`) and panics on a directory that
      # does not exist ("The system cannot find the path specified", build script of ort-sys). Fixed upstream in
      # ort-sys 2.0.0-rc.14. Drop this pin when `ort` moves to rc.14 or later.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Same LibRaw-via-vcpkg step rust-core uses (including the libraw
      # version pin -- see that job's own comment for why) -- the e2e build
      # compiles the full app (src-tauri), which needs it too.
      - name: Install LibRaw via vcpkg (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin cdf98aaa2411f565eacb3c7566e5e20542ae151a
          rm -rf "$VCPKG_INSTALLATION_ROOT/ports"
          git -C "$VCPKG_INSTALLATION_ROOT" checkout cdf98aaa2411f565eacb3c7566e5e20542ae151a -- ports
          # Classic mode installs jasper with its default `opengl` feature although libraw asks for default-features false;
          # naming jasper[core] in the same command keeps freeglut and the OpenGL ports out (scripts/vcpkg_expected_versions.json).
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "jasper[core]:x64-windows-static-md" libraw:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # RFC-0038 A1: the whole ports/ tree comes from one vcpkg commit, so the libraries LibRaw pulls in (and their licences)
      # are the ones recorded in scripts/vcpkg_expected_versions.json; fails when an installed version differs or one is new.
      - name: vcpkg libraries are the recorded versions (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: '"$VCPKG_INSTALLATION_ROOT/vcpkg" list | python "$GITHUB_WORKSPACE/scripts/check_vcpkg_versions.py" -'

      # RFC-0038 A4: the vcpkg port must be the LibRaw this repository vendors (bindgen builds the FFI structs from the
      # vendored header), which also makes "the source of LibRaw is the vendored 0.21.3 plus the port's patches" a checked claim.
      - name: LibRaw from vcpkg is the vendored version (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/check_libraw_version.py" "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/include/libraw/libraw_version.h"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Builds the debug binary with the wdio-webdriver feature + e2e
      # capability/config (see tauri.e2e.conf.json, Cargo.toml's
      # wdio-webdriver feature) and runs the WebdriverIO suite against it.
      - run: npm run test:e2e

      # The app's own `[diag +ms]` trace (src-tauri/src/diag.rs) from the e2e build, captured to a file by the wdio
      # config on CI: printed even when a spec failed, to see where a first `import_files` stalls on this runner.
      - name: Backend trace from the e2e run
        if: always()
        run: |
          grep -h "\[diag" logs/wdio-*.log | sed -E 's/^[^ ]+ INFO tauri-service:service: //' | tail -4000 || true
