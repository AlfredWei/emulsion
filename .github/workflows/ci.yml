name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust core (build + test)
    strategy:
      fail-fast: false
      matrix:
        # Both target platforms per PRD §5 ("cross-platform desktop, single
        # codebase"). Windows was deferred during M0 for lack of a local
        # Windows machine — this matrix is that deferred validation,
        # exercised for real on GitHub's own Windows runners.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # RAW decoding (ADR-0003) links a vcpkg-installed prebuilt LibRaw on
      # Windows instead of compiling it from source under MSVC (see
      # app/src-tauri/vendor/rsraw-sys/PATCH.md). GitHub's windows-latest
      # runners ship vcpkg pre-installed with VCPKG_INSTALLATION_ROOT set --
      # this step assumes that rather than bootstrapping vcpkg fresh; if
      # this fails, that assumption is what to check first.
      - name: Install LibRaw via vcpkg (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libraw:x64-windows-static-md
          # The vcpkg *crate* (used by rsraw-sys's build.rs) looks for
          # VCPKG_ROOT specifically -- the runner only sets
          # VCPKG_INSTALLATION_ROOT, which is a different variable. Confirmed
          # via a real CI failure (VcpkgNotFound) before this line existed.
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: cargo build
        run: cargo build --verbose

      # Real-file RAW decode/import tests (raw_decode.rs, import.rs) are
      # gated behind EMULSION_TEST_RAW_SAMPLE and silently *skip* without
      # it — not committed to the repo as a fixture, per ADR-0003 (large,
      # third-party provenance). Without this step, "cargo test" would
      # only ever exercise the error paths, never a real decode, in CI.
      # Fetch the same CC0-licensed sample used to validate this locally
      # (raw.pixls.us requires CC0 for all contributions) so the real
      # decode path actually runs here too, not just on a dev machine.
      - name: Download sample RAW file (CC0, raw.pixls.us) for real-file tests
        shell: bash
        run: |
          curl --retry 3 --retry-delay 5 -fL \
            -o "${{ runner.temp }}/sample.DNG" \
            "https://raw.pixls.us/data/Adobe%20DNG%20Converter/Canon%20EOS%205D%20Mark%20III/5G4A9395-compressed-lossless.DNG"

      - name: cargo test --lib
        shell: bash
        env:
          EMULSION_TEST_RAW_SAMPLE: ${{ runner.temp }}/sample.DNG
        run: cargo test --lib --verbose

  frontend-check:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check

  e2e:
    name: E2E (WebdriverIO)
    strategy:
      fail-fast: false
      matrix:
        # Same two platforms as rust-core -- the embedded WebDriver
        # provider (tauri-plugin-wdio-webdriver) supports macOS/Windows/
        # Linux, but this project only targets the first two (PRD §5).
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Same LibRaw-via-vcpkg step rust-core uses -- the e2e build compiles
      # the full app (src-tauri), which needs it too. See that job's own
      # comment for why VCPKG_ROOT is set explicitly.
      - name: Install LibRaw via vcpkg (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install libraw:x64-windows-static-md
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Builds the debug binary with the wdio-webdriver feature + e2e
      # capability/config (see tauri.e2e.conf.json, Cargo.toml's
      # wdio-webdriver feature) and runs the WebdriverIO suite against it.
      - run: npm run test:e2e
