name: vcpkg plan (throwaway)

on:
  push:
    branches: [feature/windows-library-licence-texts]

jobs:
  plan:
    runs-on: windows-latest
    steps:
      - name: Plans
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin cdf98aaa2411f565eacb3c7566e5e20542ae151a
          rm -rf "$VCPKG_INSTALLATION_ROOT/ports"
          git -C "$VCPKG_INSTALLATION_ROOT" checkout cdf98aaa2411f565eacb3c7566e5e20542ae151a -- ports
          V="$VCPKG_INSTALLATION_ROOT/vcpkg"
          echo "--- plan: libraw alone"; "$V" install --dry-run libraw:x64-windows-static-md
          echo "--- plan: jasper[core] then libraw"; "$V" install --dry-run "jasper[core]:x64-windows-static-md" libraw:x64-windows-static-md
