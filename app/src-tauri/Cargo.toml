[package]
name = "emulsion"
version = "0.1.0"
description = "Local-first photo library and RAW editor — Rust core (catalog, RAW decode, export)"
authors = ["Alfred Wei"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emulsion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
rsraw = "0.1.1"
lcms2 = { version = "6.1.1", features = ["static"] }
thiserror = "2.0.19"
blake3 = "1.8.5"
tauri-plugin-dialog = "2.7.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
kamadak-exif = "0.6.1"
lensfun = "0.7.0"
bytemuck = "1.25"
printpdf = { version = "0.12.7", default-features = false }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
# Embedded WebDriver server for e2e UI testing (app/e2e/) — opt-in only, never
# enabled in a release build. Build with `--features wdio-webdriver` for e2e runs.
wdio-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

# Patched fork of rsraw-sys so RAW decoding builds on Windows/MSVC via a
# vcpkg-linked LibRaw instead of upstream's from-source compile (which
# panics on MSVC). macOS/Linux behavior is unchanged. See
# vendor/rsraw-sys/PATCH.md and docs/adr/ADR-0003-raw-decoding.md.
[patch.crates-io]
rsraw-sys = { path = "vendor/rsraw-sys" }

[dev-dependencies]
little_exif = "0.6.23"

