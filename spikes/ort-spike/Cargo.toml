[package]
name = "ort-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "M6 slice 0 throwaway: does ONNX Runtime (ort) link and run on the project's CI platforms? RFC-0023 / ADR-0009. Not part of the app."

# Standalone: deliberately NOT a member of app/src-tauri's build.
[workspace]

[dependencies]
# Exact pin: ort has no stable 2.0 yet (RFC-0023 §4.1). Default features download
# a prebuilt ONNX Runtime at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs"] }
ndarray = "0.16"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "coreml"] }

[profile.release]
opt-level = 3
